server {
    listen 80;
    server_name your-domain.com your-ec2-public-ip;  # 実際のドメインとIPに変更してください

    # 静的ファイル
    location /static/ {
        alias /home/ubuntu/questionnaire-web-app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # メディアファイル
    location /media/ {
        alias /home/ubuntu/questionnaire-web-app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Djangoアプリケーション
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ログ設定
    access_log /var/log/nginx/questionnaire_access.log;
    error_log /var/log/nginx/questionnaire_error.log;
} 